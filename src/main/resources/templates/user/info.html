<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #212529;
        }
        .content {
            padding: 20px;
        }
        .top-bar {
            background-color: #343a40;
            border-bottom: 1px solid #495057;
            padding: 10px 0;
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <strong class="text-light me-3" th:text="${currentUser?.username}">username</strong>
                        <span class="text-light me-2">with roles</span>
                        <div th:if="${currentUser?.roles}">
                            <span th:each="role, iterStat : ${currentUser.roles}" class="badge bg-info me-1">
                                <span th:text="${#strings.replace(role.name, 'ROLE_', '')}">Role</span>
                            </span>
                        </div>
                        <div th:unless="${currentUser?.roles}">
                            <span class="badge bg-secondary">No roles</span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center">
                        <small class="text-muted me-3">User Profile</small>
                        <form th:action="@{/logout}" method="post" class="mb-0">
                            <button type="submit" class="btn btn-outline-warning btn-sm">
                                Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar p-3">
            <nav class="navbar navbar-expand-md">
                <div class="container-fluid flex-md-column align-items-start">
                    <span class="navbar-brand mb-3 h1">Navigation</span>
                    <div class="navbar-nav flex-column w-100">
                        <a th:href="@{/user/info}" class="nav-link btn btn-outline-primary mb-2 text-start">
                            User
                        </a>

                        <th:block th:each="role : ${currentUser?.roles}">
                            <a th:if="${role.name == 'ROLE_ADMIN'}"
                               th:href="@{/admin/list}"
                               class="nav-link btn btn-outline-success mb-2 text-start">
                                Admin
                            </a>
                        </th:block>
                    </div>
                </div>
            </nav>
        </div>

        <div class="col-md-9 col-lg-10 content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>User Profile</h1>
            </div>

            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Roles</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${currentUser}">
                    <td th:text="${currentUser.id}"></td>
                    <td th:text="${currentUser.username}"></td>
                    <td th:text="${currentUser.firstName}"></td>
                    <td th:text="${currentUser.lastName}"></td>
                    <td>
                            <span th:each="role, iterStat : ${currentUser.roles}">
                                <span class="badge bg-primary"
                                      th:text="${#strings.replace(role.name, 'ROLE_', '')}">Role</span>
                                <span th:if="${!iterStat.last}"> </span>
                            </span>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
